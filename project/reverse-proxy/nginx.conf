events {
	# The maximum number of simultaneous connections that can be opened by
	# a worker process.
    worker_connections 1024; 
}

http {
	# Includes mapping of file name extensions to MIME types of responses
	# and defines the default type.
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

    error_log /var/log/nginx/debug.log debug;

    # Configuração do Proxy reverso na rede proxy docker
    server {
        listen 7061 ssl;
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name localhost 127.0.0.1;

        # Redirecionamentos relativos: a porta publicada (ex.: 8298) difere da porta interna 7061
        absolute_redirect off;

        # UI (painel de monitoramento e visualização da rede) servida na raiz
        location / {
            proxy_pass http://ui:80;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Endereço antigo da UI: redireciona para a raiz (o navegador mantém o fragmento #/...)
        location /graph-view {
            return 302 /;
        }

        # Rotas API
        location /api/ {
            proxy_pass http://api:5002/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Monitoramento: leitura pública; escrita apenas pelos serviços na rede interna do Docker
        location /api/monitor/ {
            limit_except GET {
                deny all;
            }
            proxy_pass http://api:5002/monitor/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Mercado: consultas públicas; abertura de contas apenas pelos bots na rede interna do Docker
        location /api/market/ {
            limit_except GET {
                deny all;
            }
            proxy_pass http://api:5002/market/;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Ordens de compra e venda: apenas pelos bots na rede interna do Docker
        location /api/stocks/ {
            deny all;
        }

        # Rotas UI Kafka
        location /kafka-ui {       
            proxy_pass http://kafka-ui:8080;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
