# RealStockInsight - infraestrutura local completa
#
# Início rápido:
#   cp .env.example .env          # defina DB_PASSWORD (obrigatória) e, se quiser, CERT_HOST
#   docker compose up -d --build  # constrói as imagens e sobe tudo
#   abra https://localhost:8298/  # painel de monitoramento (certificado autoassinado)
#
# Outros comandos:
#   docker compose ps             # estado e healthcheck de cada contêiner
#   docker compose logs -f <svc>  # logs de um serviço (ex.: producer, consumer-net, investor-bots)
#   docker compose down           # remove os contêineres e a rede
#
# Apenas a porta 8298 (HTTPS) é exposta para fora da máquina. As demais portas publicadas
# ficam restritas a 127.0.0.1, para depuração local.
#
# Nome do projeto: defina via -p, ex.: docker compose -p realstockinsight up -d

services:
# Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: rsi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:22181:2181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kafka

# Kafka (7.x: última linha com suporte a Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rsi-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:29092:29092"
    restart: unless-stopped
    healthcheck:
      # Teste TCP leve: ferramentas de linha de comando do Kafka iniciam uma JVM e podem exceder o timeout
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - kafka

# Kafka-UI
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: rsi-kafka-ui
    hostname: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      PUBLIC_URL: /kafka-ui
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - proxy

# Database
  db:
    build: ./database/postgresql
    image: rsi-db:latest
    container_name: rsi-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userDb -d database"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - db

# Web API utilizada pela UI (grafos, tendências e monitoramento)
  api:
    build: ./webapi
    image: rsi-api:latest
    container_name: rsi-api
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5002:5002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5002/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - db
      - kafka         # apenas para o painel verificar a disponibilidade do Kafka
      - proxy
      - internal

# Web UI: painel de monitoramento e visualização de grafos
  ui:
    build: ./graph-view
    image: rsi-ui:latest
    container_name: rsi-ui
    hostname: ui
    ports:
      - "127.0.0.1:5003:80"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - proxy

# Consumer que gera a rede complexa
  consumer-net:
    build: ./kafka-services/consumer-network
    image: rsi-consumer-network:latest
    container_name: rsi-consumer-network
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - db
      - internal      # envio de status ao painel (api)

# Consumer que atualiza tendências
  consumer-trend:
    build: ./kafka-services/consumer-trend
    image: rsi-consumer-trend:latest
    container_name: rsi-consumer-trend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - db
      - internal      # envio de status ao painel (api)

# Producer que insere valores dos ativos
  producer:
    build: ./kafka-services/producer
    image: rsi-producer:latest
    container_name: rsi-producer
    environment:
      API_TOKEN: ${API_TOKEN:-}   # chave da API de ativos (nao versionar)
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - internal

# Bots de simulação de investidores
  investor-bots:
    build: ./complex-network/simulation
    image: rsi-investor-bot:latest
    container_name: rsi-investor-bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      consumer-net:
        condition: service_started
      consumer-trend:
        condition: service_started
    networks:
      - internal

# Proxy reverso: único ponto de acesso externo (HTTPS)
  nginx-proxy:
    build:
      context: ./reverse-proxy
      args:
        CERT_HOST: ${CERT_HOST:-localhost}   # hostname/IP do certificado autoassinado
    image: rsi-nginx-proxy:latest
    container_name: rsi-nginx-proxy
    ports:
      - "8298:7061"
    restart: unless-stopped
    depends_on:
      - api
      - ui
      - kafka-ui
    networks:
      - proxy

# Redes Docker para comunicação entre componentes
networks:
  kafka:
    name: kafka       # Rede dos elementos que utilizam o Kafka
  db:
    name: db          # Rede dos elementos que acessam o banco de dados
  proxy:
    name: proxy       # Rede dos elementos acessíveis via proxy reverso
  internal:
    name: internal    # Rede de comunicação interna entre serviços
