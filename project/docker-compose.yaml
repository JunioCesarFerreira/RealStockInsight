# RealStockInsight - infraestrutura local completa
#
# Uso:
#   docker compose build          # constrói todas as imagens
#   docker compose up -d          # sobe os contêineres (constrói se necessário)
#   docker compose up -d --build  # força reconstrução e sobe
#   docker compose down           # remove os contêineres e a rede
#
# Nome do projeto: defina via -p, ex.: docker compose -p realstockinsight up -d

services:
# Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: rsi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kafka

# Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: rsi-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - 29092:29092
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - kafka

# Kafka-UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rsi-kafka-ui
    hostname: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      PUBLIC_URL: /kafka-ui
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    ports:
      - 8080:8080
    depends_on:
      - kafka
    networks:
      - kafka
      - proxy

# Database
  db:
    build: ./database/postgresql
    image: rsi-db:latest
    container_name: rsi-db
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userDb -d database"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - db

# Web API utilizada pela UI para visualização de grafos
  api:
    build: ./webapi
    image: rsi-api:latest
    container_name: rsi-api
    ports:
      - "5002:5002"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - db
      - proxy
      - internal

# Web UI para visualização de grafos
  ui:
    build: ./graph-view
    image: rsi-ui:latest
    container_name: rsi-ui
    hostname: ui
    environment:
      PUBLIC_URL: /graph-view
    ports:
      - "5003:80"
    depends_on:
      - api
    networks:
      - proxy

# Consumer que gera a rede complexa
  consumer-net:
    build: ./kafka-services/consumer-network
    image: rsi-consumer-network:latest
    container_name: rsi-consumer-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - db

# Consumer que atualiza tendências
  consumer-trend:
    build: ./kafka-services/consumer-trend
    image: rsi-consumer-trend:latest
    container_name: rsi-consumer-trend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - db

# Producer que insere valores dos ativos
  producer:
    build: ./kafka-services/producer
    image: rsi-producer:latest
    container_name: rsi-producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - internal

# Bots de simulação de investidores
  investor-bots:
    build: ./complex-network/simulation
    image: rsi-investor-bot:latest
    container_name: rsi-investor-bot
    restart: unless-stopped
    depends_on:
      - api
      - consumer-net
      - consumer-trend
    networks:
      - internal

# Proxy reverso
  nginx-proxy:
    build: ./reverse-proxy
    image: rsi-nginx-proxy:latest
    container_name: rsi-nginx-proxy
    ports:
      - "8298:7061"
    depends_on:
      - api
      - ui
      - kafka-ui
    networks:
      - proxy

# Redes Docker para comunicação entre componentes
networks:
  kafka:
    name: kafka       # Rede dos elementos que utilizam o Kafka
  db:
    name: db          # Rede dos elementos que acessam o banco de dados
  proxy:
    name: proxy       # Rede dos elementos acessíveis via proxy reverso
  internal:
    name: internal    # Rede de comunicação interna entre serviços
